# Source registry. The ingest job fetches every source on each run; the site build
# reads the raw files and records each series' latest observation on the status table.
site_url: https://yottachem.github.io/unemployment-gap/
fred:
  url: https://fred.stlouisfed.org/graph/fredgraph.csv?id={id}
  publisher: BLS via FRED (Federal Reserve Bank of St. Louis)
  license: Public domain (US Gov); FRED attribution requested
  series:
    UNRATE:      {label: "Unemployment rate (U-3)", unit: pct, source: "BLS Current Population Survey"}
    U6RATE:      {label: "U-6 (adds underemployed and marginally attached)", unit: pct, source: "BLS Current Population Survey"}
    LNS13025703: {label: "Share of unemployed out 27+ weeks", unit: pct, source: "BLS Current Population Survey"}
    UEMP27OV:    {label: "Unemployed 27+ weeks", unit: thousands, source: "BLS Current Population Survey"}
    UEMPMED:     {label: "Median weeks unemployed", unit: weeks, source: "BLS Current Population Survey"}
    LNS12300060: {label: "Employment rate, ages 25-54", unit: pct, source: "BLS Current Population Survey"}
    JTSHIR:      {label: "Hiring rate", unit: pct, source: "BLS JOLTS"}
    JTSLDR:      {label: "Layoff and discharge rate", unit: pct, source: "BLS JOLTS"}
    USREC:       {label: "NBER recession indicator", unit: flag, source: "NBER via FRED"}

dol_5159:
  url: https://oui.doleta.gov/unemploy/csv/ar5159.csv
  name: "ETA 5159 Claims and Payment Activities (state UI)"
  publisher: U.S. Department of Labor, Employment and Training Administration
  license: Public domain (US Gov)
  data_map: https://oui.doleta.gov/dmstree/handbooks/402/402_4/4024c6/4024c6.pdf#ETA5159
  columns:
    c51: first_payments   # First payments, state UI, total (line 303, col 21)
    c56: final_payments   # Final payments, state UI, total (line 303, col 26)

sipp:
  url: https://www2.census.gov/programs-surveys/sipp/data/datasets/{year}/pu{year}_csv.zip
  name: Survey of Income and Program Participation, public-use files
  publisher: U.S. Census Bureau
  license: Public domain (US Gov)
  years: [2023, 2024, 2025]   # interview years; each covers the prior calendar year
  note: Processed locally by analysis/sipp.py (about 3 GB per year); output committed to site/data/sipp.json

# Sector breakout. CPS unemployment rates by industry of last job are not seasonally adjusted,
# so the site compares 12-month averages. JOLTS rates come from the BLS API (keyless v1:
# 25 series and 10 years per request, 25 requests per day).
bls_api:
  url: https://api.bls.gov/publicAPI/v1/timeseries/data/
  jolts_id: "JTS{code}000000000{element}R"   # industry code, all US, all size classes; HI hires, LD layoffs
  elements: {HI: hires, LD: layoffs}
  start_year: 2001
sectors:
  - {key: construction, label: Construction,                       cps: [LNU04032231], jolts: "230000"}
  - {key: manufacturing, label: Manufacturing,                     cps: [LNU04032232], jolts: "300000"}
  - {key: trade_transport, label: "Trade, transportation, utilities", cps: [LNU04032235, LNU04032236], cps_levels: [LNU03032235, LNU03032236], jolts: "400000"}
  - {key: information, label: Information,                         cps: [LNU04032237], jolts: "510000"}
  - {key: financial, label: Financial activities,                  cps: [LNU04032238], jolts: "510099"}
  - {key: professional, label: Professional and business services, cps: [LNU04032239], jolts: "540099"}
  - {key: edu_health, label: Education and health services,        cps: [LNU04032240], jolts: "600000"}
  - {key: leisure, label: Leisure and hospitality,                 cps: [LNU04032241], jolts: "700000"}
  - {key: other_services, label: Other services,                   cps: [LNU04032242], jolts: "810000"}
  - {key: government, label: Government,                           cps: [LNU04028615], jolts: "900000"}
  - {key: all, label: All industries,                              cps: [UNRATE], jolts: "000000"}

# Tech and biotech payroll employment (BLS Current Employment Statistics), indexed to the 2019
# average. FRED carries some detailed industries; the rest come from the BLS API. Candidate ids
# are tried in order and the first that returns data is used; an industry with no data yet is
# listed as pending on the site. `replaces` hides a stand-in once the real series is confirmed.
industries:
  start_year: 2007
  list:
    - {key: csd, short: "IT services", group: tech, label: Computer systems design and IT services, sector: Professional and business services, ids: [CES6054150001], via: fred}
    - {key: hosting, short: "Hosting and cloud", group: tech, label: "Data processing, hosting, cloud infrastructure", sector: Information, ids: [CES5051800001], via: fred}
    - {key: software, short: "Software publishers", group: tech, label: Software publishers, sector: Information, ids: [CES5051320001, CEU5051320001, CES5051120001, CEU5051120001], via: bls}
    - {key: semis, short: "Semiconductors", group: tech, label: Semiconductors and electronic components, sector: Manufacturing, ids: [CES3133440001], via: fred}
    - {key: rnd, short: "Scientific R&D", group: biotech, label: Scientific research and development services, sector: Professional and business services, ids: [CES6054170001, CEU6054170001, CES6054171001, CEU6054171001], via: bls}
    - {key: pharma, short: "Pharma manufacturing", group: biotech, label: Pharmaceutical and medicine manufacturing, sector: Manufacturing, ids: [CES3232540001, CEU3232540001], via: bls}
    - {key: chem, short: "Chemical manufacturing", group: biotech, label: "Chemical manufacturing (includes pharma)", sector: Manufacturing, ids: [CES3232500001], via: fred, replaced_by: pharma}
    - {key: instruments, short: "Instruments", group: biotech, label: "Measuring, electromedical, and control instruments", sector: Manufacturing, ids: [CES3133450001], via: fred}
